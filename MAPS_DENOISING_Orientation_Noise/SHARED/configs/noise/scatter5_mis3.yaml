# (see src/make_test_grid.py, which wrote this file).
#
#   make noise NOISE=scatter5_mis3
description: Uniform-angle scatter up to 5 deg (2.5 deg mean), 3% misindexed, boundary-biased.

noise:                  # add_ebsd_noise.py settings
  shape: [128, 128]
  start: 0              # first map (0 = map_00001)
  limit: 500            # maps 1-500 are the test set
  scatter: 5.0          # max tilt angle in deg; angle is uniform in [0, max]
  misindex: 0.03
  boundary_bias: 4.0    # a grain-boundary pixel is 4x more likely to be misindexed
  seed: 0               # 	Fixes the randomness, so every run makes exactly the same noise. All grid files share this seed, so only the noise levels differ between test sets.
  save_mask: true       # save a map of which pixels were misindexed
  ang: true             # .ang copies for MTEX
  step: 1.0              # Pixel spacing written into the .ang files
