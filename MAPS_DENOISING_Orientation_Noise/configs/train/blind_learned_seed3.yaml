# The main model: ONE network for every noise level, trained on the train split
# (maps 1001-40000) with a fresh random level per map, validated on the fixed
# noisy validation set (datasets/splits/val/noise_random, maps 501-1000).
# Neighbour weights are learned (kernel: learned), so there is no mean_tol.
# Seeds 1, 2 and 3 differ only in seed; together they give the run-to-run spread.
#
#   CONFIG=blind_learned_seed3 sbatch src/train_model.sh --resume auto
description: Blind model, learned neighbour weights, scatter max 0-9 deg and misindexing 0-10% per map, seed 3.
test_set: scatter5      # scored when training ends; the full test grid is scored separately

train:                  # train.py settings
  # training noise: every map, every epoch, gets its own random level
  noise_mode: random
  scatter_deg: 9.0      # scatter max ~ U[0, 9] deg
  misindex: 0.10        # misindexed fraction ~ U[0, 0.10]
  boundary_bias: 4.0    # a boundary pixel is 4x more likely to be misindexed

  # data
  train_cache: split_train_clean   # all 38,998 training maps
  # validation: train.py defaults to datasets/splits/val (clean_euler, noise_random)
  no_augment: false
  seed: 3

  # model
  kernel: learned       # the network chooses every neighbour's weight
  mean_radius: 4        # 9x9 neighbour window
  base_channels: 32
  max_refine_deg: 25.0  # cap on the small correction applied after averaging
  no_misfit: false

  # optimisation
  epochs: 60
  batch_size: 16
  lr: 0.0002
  weight_decay: 0.0
  loss: charbonnier
  loss_eps: 1.0e-10
  w_bad: 5.0
  w_bnd: 2.0
  w_gate: 1.0
  w_refine: 5.0
  w_replace: 0.5
